name: Build Diagnostic IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      configuration:
        description: Xcode configuration
        required: true
        default: Release
        type: choice
        options:
          - Debug
          - Release

permissions:
  contents: read

jobs:
  build-diagnostic:
    name: Build Reynard diagnostic IPA
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Show Apple toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version
          rustc --version
          cargo --version

      - name: Install ldid
        run: brew install ldid

      - name: Sync Gecko source
        run: ./tools/development/update-gecko.sh

      - name: Apply Gecko patches
        run: ./tools/development/apply-patches.sh

      - name: Patch Gecko ld64 detection for Xcode 26
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("engine/firefox/build/moz.configure/toolchain.configure")
          text = path.read_text()
          old = 'if retcode == 1 and "Logging ld64 options" in stderr:'
          new = 'if retcode == 1 and (target.kernel == "Darwin" or "Logging ld64 options" in stderr):'
          if old not in text:
              raise SystemExit("Expected Gecko ld64 detection code was not found")
          path.write_text(text.replace(old, new, 1))
          print("Applied Xcode 26 ld64 detection compatibility patch")
          PY

      - name: Build idevice pairing library
        run: ./tools/development/build-idevice.sh

      - name: Install Gecko build tools
        run: |
          cargo install cbindgen --locked

      - name: Prepare Gecko build config
        run: touch engine/firefox/.mozconfig

      - name: Build Gecko
        run: |
          # The diagnostic build does not need Gecko's optional sandboxed WASM
          # libraries; skipping them avoids a separate WASI SDK dependency.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tools/development/build-gecko.sh")
          text = path.read_text()
          marker = 'echo "ac_add_options --enable-application=mobile/ios"\n'
          addition = marker + '\techo "ac_add_options --without-wasm-sandboxed-libraries"\n'
          if addition not in text:
              if marker not in text:
                  raise SystemExit("Gecko build configuration marker not found")
              text = text.replace(marker, addition, 1)
              path.write_text(text)
          print("Disabled optional sandboxed WASM libraries for CI diagnostic build")
          PY
          ./tools/development/build-gecko.sh

      - name: Archive Reynard without Apple provisioning
        env:
          BUILD_CONFIGURATION: ${{ inputs.configuration || 'Release' }}
        run: |
          set -o pipefail
          rm -rf dist
          mkdir -p dist
          cp browser/Configuration/Reynard.xcconfig dist/Reynard.xcconfig
          BUILD_SHA="${GITHUB_SHA::7}"
          sed -i '' "s/CURRENT_BUILD = .*/CURRENT_BUILD = ${BUILD_SHA}/" dist/Reynard.xcconfig

          xcodebuild archive \
            -scheme Reynard \
            -project browser/Reynard.xcodeproj \
            -sdk iphoneos \
            -arch arm64 \
            -configuration "${BUILD_CONFIGURATION}" \
            -archivePath dist/Reynard.xcarchive \
            -xcconfig dist/Reynard.xcconfig \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee dist/xcodebuild.log

      - name: Package IPA and TrollStore TIPA
        run: ./tools/release/create-ipa.sh

      - name: Upload diagnostic artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: reynard-diagnostic-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/Reynard.ipa
            dist/Reynard-TrollStore.tipa
            dist/Reynard-Jailbroken.ipa
            dist/xcodebuild.log

      - name: Upload build log after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reynard-diagnostic-build-log-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: dist/xcodebuild.log
