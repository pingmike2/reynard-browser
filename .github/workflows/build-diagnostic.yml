name: Build Diagnostic IPA

on:
  push:
    branches:
      - main
      - 'jit-upstream-batch1'
    paths:
      - 'browser/**'
      - 'patches/**'
      - 'tools/**'
      - '.github/workflows/build-diagnostic.yml'
      - 'engine/release.txt'
  workflow_dispatch:
    inputs:
      configuration:
        description: Xcode configuration
        required: true
        default: Release
        type: choice
        options:
          - Debug
          - Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build-diagnostic:
    name: Build Reynard diagnostic IPA
    runs-on: macos-26
    # Gecko 全量构建实测 327-335 分钟，再加约 10 分钟的打包与上传，
    # 离上限只剩 25 分钟余量。托管 runner 的硬上限是 6 小时（360 分钟，
    # 见 Actions limits），写更大也不会放宽，超时即被杀并丢掉全部产物。
    # 要真正留出余量只能缩短构建时间，不能靠调大这个值。
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # 子模块由 update-gecko.sh 按 release.txt 浅拉，
          # 递归 checkout 会多拉几个 G 的历史再被覆盖。
          submodules: false

      - name: Show Apple toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version
          rustc --version
          cargo --version
          python3 --version

      - name: Pin Python for mach
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install ldid, lld and cbindgen
        run: brew install ldid lld cbindgen

      - name: Put lld on PATH
        run: echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Sync Gecko source
        run: ./tools/development/update-gecko.sh

      - name: Apply Gecko patches
        run: ./tools/development/apply-patches.sh

      - name: Cache Gecko build
        id: gecko-cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: |
            engine/firefox/obj-aarch64-apple-ios
            ~/.mozbuild
            ~/.cargo/registry
            ~/.cargo/git
          # 构建参数（linker / LTO / jemalloc / WASM）由 build-gecko.sh 和本文件决定，
          # 必须进 key，否则改参数后会命中不兼容的 obj 目录。
          # 构建参数（LTO / jemalloc / WASM / linker）的开关都在 build-gecko.sh 里，
          # 所以它进 key；workflow 文件本身不进 key（改注释/超时不该废掉数 GB 缓存）。
          # 改了 build-gecko.sh 的默认值或调用参数时，手动把 v2 往上加一版。
          key: gecko-v2-${{ runner.os }}-${{ hashFiles('engine/release.txt', 'patches/**', 'tools/development/build-gecko.sh') }}

      - name: Build idevice pairing library
        run: ./tools/development/build-idevice.sh

      - name: Prepare Gecko build config
        run: touch engine/firefox/.mozconfig

      - name: Build Gecko
        env:
          # mach 的 bootstrap 会在 taskgraph venv 里编译 orjson/rtoml 这类
          # Rust 扩展，它们按 PyO3 支持的最高版本建，runner 镜像的 3.15 太新。
          PYTHON: python3
          # 与上游 build.yml 一致：bootstrap 工具链是 LLVM22，链接同样走 lld。
          LD: ld64.lld
        run: |
          # 缓存的 obj 目录可能带 merge-day CLOBBER 标记，mach 会要求全量
          # clobber 重建并直接退出；删掉标记以启用增量构建。
          rm -f engine/firefox/obj-aarch64-apple-ios/CLOBBER
          # jemalloc 在 libhooker 注入下会让应用启动即崩溃（上游 #312）；
          # 该 CI 产出的三包共用同一份 Gecko，故统一关闭。
          # 关闭 LTO / jemalloc / WASM 沙箱库的组合固定为 --ci-diagnostic；
          # 参数定义在 build-gecko.sh 内，因此会被缓存 key 的 hashFiles 覆盖。
          # sccache 已移除：远程后端只写进百来个对象（约 129 MB），对全量
          # 构建是纯 miss 开销，反而比不接更慢。
          ./tools/development/build-gecko.sh --ci-diagnostic

      - name: Archive Reynard without Apple provisioning
        env:
          BUILD_CONFIGURATION: ${{ inputs.configuration || 'Release' }}
        run: |
          set -o pipefail
          rm -rf dist
          mkdir -p dist
          cp browser/Configuration/Reynard.xcconfig dist/Reynard.xcconfig
          BUILD_SHA="${GITHUB_SHA::7}"
          sed -i '' "s/CURRENT_BUILD = .*/CURRENT_BUILD = ${BUILD_SHA}/" dist/Reynard.xcconfig

          xcodebuild archive \
            -scheme Reynard \
            -project browser/Reynard.xcodeproj \
            -sdk iphoneos \
            -arch arm64 \
            -configuration "${BUILD_CONFIGURATION}" \
            -archivePath dist/Reynard.xcarchive \
            -xcconfig dist/Reynard.xcconfig \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee dist/xcodebuild.log

          # 不签名构建会跳过 Xcode 的 bitcode 剥离，残留 bitcode 的
          # libswift_Concurrency.dylib 会让 iOS 13.0 - 14.7 启动即崩溃。
          # https://developer.apple.com/documentation/Xcode-Release-Notes/xcode-13_3_1-release-notes
          SWIFT_CONCURRENCY_PATH="dist/Reynard.xcarchive/Products/Applications/Reynard.app/Frameworks/libswift_Concurrency.dylib"
          if [ -f "$SWIFT_CONCURRENCY_PATH" ]; then
            xcrun bitcode_strip "$SWIFT_CONCURRENCY_PATH" -r -o "$SWIFT_CONCURRENCY_PATH"
            /usr/bin/codesign --force --sign - --verbose "$SWIFT_CONCURRENCY_PATH"
          else
            echo "::error::libswift_Concurrency.dylib not found in archive"
            exit 1
          fi

      - name: Package IPA
        run: ./tools/release/create-ipa.sh

      - name: Package TrollStore TIPA
        run: ./tools/release/create-ipa.sh --trollstore

      - name: Package Jailbroken IPA
        run: ./tools/release/create-ipa.sh --jailbroken

      - name: Upload diagnostic artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: reynard-diagnostic-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/Reynard.ipa
            dist/Reynard-TrollStore.tipa
            dist/Reynard-Jailbroken.ipa
            dist/xcodebuild.log

      - name: Publish diagnostic Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SHA8="${GITHUB_SHA::8}"
          TAG="reynard-diagnostic-${SHA8}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its assets."
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              dist/Reynard.ipa \
              dist/Reynard-TrollStore.tipa \
              dist/Reynard-Jailbroken.ipa
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Reynard Diagnostic Build ($SHA8)" \
              --notes "自动构建 commit $SHA8。Reynard-TrollStore.tipa = TrollStore 安装；Reynard-Jailbroken.ipa = 越狱安装；Reynard.ipa = 通用。" \
              dist/Reynard.ipa \
              dist/Reynard-TrollStore.tipa \
              dist/Reynard-Jailbroken.ipa
          fi

      - name: Upload build log after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reynard-diagnostic-build-log-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: dist/xcodebuild.log